name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: uv run pytest tests/ -v --tb=short --cov=llm_cache_router --cov-branch --cov-report=xml --cov-report=json

      - name: Save coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.json

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Ruff lint
        run: uv run ruff check llm_cache_router/

      - name: Ruff format check
        run: uv run ruff format --check llm_cache_router/

      - name: Mypy type check
        run: uv run mypy llm_cache_router/ --ignore-missing-imports

  distribution:
    name: Build & Offline Wheel Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distributions
        run: python -m twine check --strict dist/*

      - name: Install wheel in a fresh environment (hash/NumPy fallback only)
        run: |
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install "pydantic>=2.0" "httpx>=0.27" "numpy>=1.26"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install --no-deps dist/*.whl

      - name: Smoke-test installed CLI and bundled resources outside source import path
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: '"$RUNNER_TEMP/wheel-smoke/bin/python" -I tests/smoke_distribution.py'

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - name: Audit locked dependencies
        run: |
          uv export --locked --all-extras --no-emit-project --no-hashes --format requirements-txt > audit-requirements.txt
          uvx pip-audit -r audit-requirements.txt --no-deps --disable-pip
